name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          VERSION="${TAG_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Release tag: ${TAG_NAME}, version: ${VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up custom keystore (if configured in secrets)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "Custom release keystore decoded."
          else
            echo "No custom keystore secret provided; building with default signing."
          fi

      - name: Build Release APK with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi
          RELEASE_APK="Thorientation-${TAG_NAME}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"
          echo "RELEASE_APK=${RELEASE_APK}" >> $GITHUB_ENV
          echo "RELEASE_APK_SHA=${RELEASE_APK}.sha256" >> $GITHUB_ENV
          echo "Artifact prepared: ${RELEASE_APK}"

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python .github/scripts/extract_changelog.py "${TAG_NAME}"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Thorientation ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_APK }}
            ${{ env.RELEASE_APK_SHA }}
